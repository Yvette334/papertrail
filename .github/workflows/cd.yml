name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
    
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: papertrail
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG -t $REGISTRY/$REPOSITORY:latest .
      
      - name: Aqua Security Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/papertrail:${{ github.sha }}
          exit-code: "1"
          ignore-unfixed: true
          version: v0.69.3
          severity: HIGH,CRITICAL
          
      - name: Scan IaC using Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          soft_fail: false
          quiet: true 
          skip_check: CKV_AWS_126,CKV2_AWS_11,CKV2_AWS_41
        
      - name: Push image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: papertrail
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:latest
        
      - name: Install Ansible
        run: |
          pip install ansible boto3
          ansible-galaxy collection install community.docker community.general
      
      - name:  Run Ansible playbook
        uses: dawidd6/action-ansible-playbook@v2
        with:
          playbook: playbook.yml
          directory: ansible/
          key: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
          options: |
            -i inventory.ini
            -e "docker_image=${{ secrets.ECR_REPOSITORY_URL }}:${{ github.sha }}"
            -e "ecr_url=${{ secrets.ECR_REPOSITORY_URL }}"
            -e "ecr_region=${{ secrets.AWS_REGION }}"
            -e "aws_access_key_id=${{ secrets.AWS_ACCESS_KEY_ID }}"
            -e "aws_secret_access_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}"
