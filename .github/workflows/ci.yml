name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test-build:
    name: Lint, test and build
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linters
        run: npm run lint

      - name: Run tests
        run: npm test
      
      - name: Build Docker image
        run: docker build -t papertrail:ci .

      - name: Smoke test container
        run: |
          docker run -d --name papertrail-ci -p 3000:3000 papertrail:ci
          sleep 5
          curl --fail http://localhost:3000/health
          docker rm -f papertrail-ci

  dependency-scan:
    name: Dependency scan
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  image-scan:
    name: Image scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t papertrail:scan .

      - name: Scan image using Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: papertrail:scan
          version: v0.69.3
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  iac-scan:
    name: IaC scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan IaC using Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          soft_fail: false
          quiet: true 
          skip_check: CKV_AWS_126,CKV2_AWS_11,CKV2_AWS_41