name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test-build:
    name: Lint, test and build
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linters
        run: npm run lint

      - name: Run tests
        run: npm test
      
      - name: Build Docker image
        run: docker build -t papertrail:ci .

      - name: Smoke test container
        run: |
          docker run -d --name papertrail-ci -p 3000:3000 papertrail:ci
          sleep 5
          curl --fail http://localhost:3000/health
          docker rm -f papertrail-ci
