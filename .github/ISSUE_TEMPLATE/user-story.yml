name: User Story
description: Create a user story for core functionality
title: "[US]: "
labels: ["feature"]
body:
  - type: textarea
    id: story
    attributes:
      label: User Story
      description: As a [user], I want [feature] so that [benefit].
      placeholder: "As a student, I want to take a 5-question quiz so that I can test my knowledge."
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: List the conditions that must be met.
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true