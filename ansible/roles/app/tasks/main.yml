---
- name: Install the AWS CLI
  ansible.builtin.apt:
    name: awscli
    state: present
  register: aws_cli_install
  until: aws_cli_install is succeeded
  retries: 3
  delay: 10

- name: Pull the PaperTrail container image
  community.docker.docker_image:
    name: "{{ docker_image }}"
    source: pull
    force_source: true
  register: image_pull
  retries: 3
  delay: 5
  until: image_pull is succeeded

- name: Check that the app health endpoint answers
  ansible.builtin.uri:
    url: "http://localhost:{{ app_port }}/health"
    status_code: 200
  register: health
  until: health.status == 200
  retries: 5
  delay: 3