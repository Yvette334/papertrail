---
- name: Install the AWS CLI
  ansible.builtin.apt:
    name: awscli
    state: present
  register: aws_cli_install
  until: aws_cli_install is succeeded
  retries: 3
  delay: 10

- name: Log in to ECR
  ansible.builtin.shell: aws ecr get-login-password --region {{ ecr_region }} | docker login --username AWS --password-stdin {{ ecr_url }}
  environment:
    AWS_ACCESS_KEY_ID: "{{ aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws_secret_access_key }}"
    AWS_DEFAULT_REGION: "{{ ecr_region }}"
  no_log: true
  register: ecr_login
  until: ecr_login is succeeded
  retries: 3
  delay: 10

- name: Pull the PaperTrail container image
  community.docker.docker_image:
    name: "{{ docker_image }}"
    source: pull
    force_source: true
  register: image_pull
  retries: 3
  delay: 5
  until: image_pull is succeeded

- name: Check that the app health endpoint answers
  ansible.builtin.uri:
    url: "http://localhost:{{ app_port }}/health"
    status_code: 200
  register: health
  until: health.status == 200
  retries: 5
  delay: 3