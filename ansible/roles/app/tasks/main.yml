---
- name: Run the PaperTrail container
  community.docker.docker_container:
    name: papertrail
    image: "{{ app_image }}"
    state: started
    restart_policy: unless-stopped
    published_ports:
      - "{{ app_port }}:{{ app_port }}"
    env:
      PORT: "{{ app_port }}"
  register: app_container
  until: app_container is succeeded
  retries: 3
  delay: 10

- name: Check that the app health endpoint answers
  ansible.builtin.uri:
    url: "http://localhost:{{ app_port }}/health"
    status_code: 200
  register: health
  until: health.status == 200
  retries: 5
  delay: 3