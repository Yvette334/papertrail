---
- name: Install the UFW firewall
  ansible.builtin.apt:
    name: ufw
    state: present
  register: ufw_install
  until: ufw_install is succeeded
  retries: 3
  delay: 10

- name: Allow SSH and the app port through the firewall
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "22"
    - "{{ app_port }}"

- name: Turn the firewall on and block everything else
  community.general.ufw:
    state: enabled
    policy: deny

- name: Disable root login over SSH
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin no'
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart SSH

- name: Disable password login over SSH
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart SSH