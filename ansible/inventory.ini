[papertrail]
10.0.2.10 ansible_user=ubuntu ansible_ssh_private_key_file=.ansible_key

[papertrail:vars]
# Inner ssh is a separate process, so it needs -i .ansible_key (GitHub Actions)
# and StrictHostKeyChecking=no on the bastion hop. Missing that causes:
# Connection closed by UNKNOWN port 65535
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes -o ProxyCommand="ssh -W %h:%p -i .ansible_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes ubuntu@13.51.16.163"'
