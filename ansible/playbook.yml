---
- name: Configure the PaperTrail server
  hosts: papertrail
  become: true

  tasks:
    - name: Update the apt package list
      ansible.builtin.apt:
        update_cache: true

    - name: Install Docker and the Python Docker library
      ansible.builtin.apt:
        name:
          - docker.io
          - python3-docker
        state: present

    - name: Make sure Docker is running and starts on boot
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Run the PaperTrail container
      community.docker.docker_container:
        name: papertrail
        image: josianekk/papertrail:v2
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "3000:3000"
        env:
          PORT: "3000"

    - name: Install the UFW firewall
      ansible.builtin.apt:
        name: ufw
        state: present

    - name: Allow SSH and the app port through the firewall
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "22"
        - "3000"

    - name: Turn the firewall on and block everything else
      community.general.ufw:
        state: enabled
        policy: deny

    - name: Disable root login over SSH
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
      notify: Restart SSH

    - name: Disable password login over SSH
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
      notify: Restart SSH

  handlers:
    - name: Restart SSH
      ansible.builtin.service:
        name: ssh
        state: restarted
